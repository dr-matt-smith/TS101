<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Arial, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/>
    </marker>
  </defs>
  <g font-size="14" fill="#1b1f2a" text-anchor="middle">
    <!-- inputs -->
    <rect x="20" y="30" width="160" height="50" rx="8" fill="#f1faee" stroke="#457b9d"/>
    <text x="100" y="52">src/</text><text x="100" y="70" font-size="12" fill="#5b6472">your TypeScript</text>
    <rect x="20" y="110" width="160" height="50" rx="8" fill="#f1faee" stroke="#457b9d"/>
    <text x="100" y="132">public/</text><text x="100" y="150" font-size="12" fill="#5b6472">HTML, CSS, images</text>
    <rect x="20" y="190" width="160" height="50" rx="8" fill="#f1faee" stroke="#457b9d"/>
    <text x="100" y="212">tests/</text><text x="100" y="230" font-size="12" fill="#5b6472">your tests</text>

    <!-- build -->
    <rect x="250" y="20" width="230" height="230" rx="10" fill="#a8dadc" stroke="#457b9d"/>
    <text x="365" y="46" font-weight="bold">deno task dev</text>
    <text x="365" y="64" font-size="12" fill="#1d3557">(started by terminal.console)</text>
    <g font-size="13" text-anchor="start">
      <text x="268" y="98">1  type check</text>
      <text x="268" y="126">2  bundle src/main.ts</text>
      <text x="268" y="154">3  copy public/</text>
      <text x="268" y="182">4  tidy dist/</text>
      <text x="268" y="210">5  run the tests</text>
      <text x="268" y="236" fill="#1d3557">... then wait for a save</text>
    </g>

    <!-- outputs -->
    <rect x="550" y="40" width="190" height="60" rx="8" fill="#1d3557"/>
    <text x="645" y="64" fill="#ffffff">dist/</text><text x="645" y="84" font-size="12" fill="#a8dadc">index.html + app.js</text>
    <rect x="550" y="170" width="190" height="60" rx="8" fill="#1d3557"/>
    <text x="645" y="194" fill="#ffffff">test_output/</text><text x="645" y="214" font-size="12" fill="#a8dadc">index.html, summary.md</text>
  </g>
  <g stroke="#1d3557" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="180" y1="55" x2="247" y2="80"/><line x1="180" y1="135" x2="247" y2="135"/><line x1="180" y1="215" x2="247" y2="190"/>
    <line x1="480" y1="110" x2="547" y2="75"/><line x1="480" y1="200" x2="547" y2="200"/>
    <path d="M 365 250 Q 365 300 200 300 Q 100 300 100 245" stroke-dasharray="6 4"/>
  </g>
  <text x="290" y="318" font-size="13" fill="#5b6472" text-anchor="middle">you save a file - it all happens again</text>
  <text x="645" y="128" font-size="12" fill="#5b6472" text-anchor="middle">preview: press refresh</text>
  <text x="645" y="258" font-size="12" fill="#5b6472" text-anchor="middle">TAP in the console too</text>
</svg>
